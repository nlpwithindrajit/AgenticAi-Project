name: sync-secrets

# Push application secrets from GitHub Actions secrets into SSM Parameter
# Store, which is where the ECS task definitions read them from at task start.
#
# Separate from `deploy` on purpose. That workflow ships code and states that
# it never touches infrastructure; folding credential writes into it would
# break that promise, rewrite production keys on every release, and make
# rotating a key require a full rebuild. This is the same `put_secret` step
# provision-ecs.sh runs from a developer's shell, for anyone who has repo
# access but not a local profile for the deploy account.
#
# Safe to re-run: an empty GitHub secret is skipped rather than written, so a
# missing one leaves the existing SSM value alone instead of blanking it.
on:
  workflow_dispatch:

concurrency:
  # Shares the deploy group: rewriting a credential while tasks are rolling
  # would leave half the tasks on the old key and half on the new one.
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT: travel-planner

permissions:
  contents: read
  id-token: write # for the OIDC upgrade described in README.md

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write SecureString parameters
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          put() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "  /$PROJECT/$name — no GitHub secret set, left unchanged"
              return
            fi
            aws ssm put-parameter --name "/$PROJECT/$name" \
              --type SecureString --value "$value" --overwrite >/dev/null
            echo "  /$PROJECT/$name updated"
          }
          put SERPAPI_API_KEY   "$SERPAPI_API_KEY"
          put OPENAI_API_KEY    "$OPENAI_API_KEY"
          put LANGFUSE_PUBLIC_KEY "$LANGFUSE_PUBLIC_KEY"
          put LANGFUSE_SECRET_KEY "$LANGFUSE_SECRET_KEY"

      - name: List what the API will read
        run: |
          aws ssm get-parameters-by-path --path "/$PROJECT" \
            --query 'Parameters[].[Name,Type,LastModifiedDate]' --output table
