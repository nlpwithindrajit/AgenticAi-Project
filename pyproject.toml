[project]
name = "ai-travel-planner"
version = "0.1.0"
description = "Multi-agent LangGraph travel planner"
requires-python = ">=3.11"

# Source of truth for dependencies. `requirements.txt` is generated from this
# (see the Quickstart in README.md) and kept only for the Docker build in
# Milestone 8, which installs without uv.
dependencies = [
    # Core API.
    # The FastAPI floor matters: below 0.141 it passes `on_startup` to
    # Starlette's Router.__init__, which Starlette 1.x removed, and the pair
    # dies on import before any project code loads.
    "fastapi>=0.141",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Agent workflow.
    "langgraph>=0.2.50",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    # Observability.
    "langfuse>=3.0",
    # HTTP.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
